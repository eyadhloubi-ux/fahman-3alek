services:
  - type: web
    name: fahman-3alek
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: STATS_KEY
        generateValue: true
      - key: HOST_GRACE_MS
        value: "40000"
